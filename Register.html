<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Konstruksi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Open Sans", sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 0 10px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: url("konstruksi2.jpg"), #000;
            background-position: center;
            background-size: cover;
            z-index: -1;
        }
        .wrapper {
            width: 400px;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 700;
        }
        .input-field {
            position: relative;
            border-bottom: 2px solid #ccc;
            margin: 15px 0;
        }
        .input-field label {
            position: absolute;
            top: 50%;
            left: 0;
            color: #fff;
            font-size: 16px;
            pointer-events: none;
            transition: 0.15s ease;
        }
        .input-field input {
            width: 100%;
            height: 40px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            color: #fff;
            padding-bottom: 5px;
        }
        .input-field input:focus~label,
        .input-field input:valid~label {
            font-size: 0.8rem;
            top: 10px;
            transform: translateY(-120%);
        }
        .input-field input::placeholder {
            color: transparent;
        }
        .forget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 25px 0 35px 0;
            color: #fff;
        }
        #remember {
            accent-color: #fff;
            width: 18px;
            height: 18px;
        }
        .forget label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .forget label p {
            margin-left: 8px;
            font-size: 14px;
        }
        .wrapper a {
            color: #efefef;
            text-decoration: none;
        }
        .wrapper a:hover {
            text-decoration: underline;
        }
        button {
            background: #fff;
            color: #000;
            font-weight: 600;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 16px;
            border: 2px solid transparent;
            transition: 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            color: #fff;
            border-color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }
        .register {
            text-align: center;
            margin-top: 30px;
            color: #fff;
            font-size: 14px;
        }
        @media (max-width: 480px) {
            .wrapper {
                width: 90%;
                padding: 20px;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <form action="#" method="POST">
            <h2>Buat Akun</h2>
            
            <div class="input-field">
                <input type="text" name="nama" id="nama">
                <label for="nama">Nama Lengkap</label>
            </div>

            <div class="input-field">
                <input type="text" name="nama" id="email">
                <label for="nama">Email</label>
            </div>

            <div class="input-field">
                <input type="tel" name="telepon" id="telepon" >
                <label for="telepon">Nomor Telepon</label>
            </div>

            <div class="input-field">
                <input type="password" name="password" id="password" >
                <label for="password">Password</label>
            </div>

            <div class="input-field">
                <input type="password" name="confirm_password" id="confirm_password" >
                <label for="confirm_password">Konfirmasi Password</label>
            </div>

            <div class="forget">
                <label for="remember">
                    <input type="checkbox" id="remember">
                    <p>Saya setuju dengan <a href="#">Syarat & Ketentuan</a></p>
                </label>
            </div>

            <button type="submit">Daftar Sekarang</button>
        </form>

        <div class="register">
            Sudah punya akun? <a href="#">Masuk di sini</a>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
    const namaInput = document.getElementById('nama');
    const emailInput = document.getElementById('email');
    const teleponInput = document.getElementById('telepon');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm_password');
    const registerBtn = document.querySelector('button[type="submit"]');
    const registerForm = document.querySelector('form');

    function validateInputs() {
        const nama = namaInput.value.trim();
        const email = emailInput.value.trim();
        const telepon = teleponInput.value.trim();
        const password = passwordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();
        
        if (nama === '' || email === '' || telepon === '' || password === '' || confirmPassword === '') {
            registerBtn.disabled = true;
            registerBtn.style.opacity = '0.6';
            registerBtn.style.cursor = 'not-allowed';
        } else {
            registerBtn.disabled = false;
            registerBtn.style.opacity = '1';
            registerBtn.style.cursor = 'pointer';
        }
    }

    namaInput.addEventListener('input', validateInputs);
    emailInput.addEventListener('input', validateInputs);
    teleponInput.addEventListener('input', validateInputs);
    passwordInput.addEventListener('input', validateInputs);
    confirmPasswordInput.addEventListener('input', validateInputs);

    
    validateInputs();

    registerForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nama = namaInput.value.trim();
        const email = emailInput.value.trim();
        const telepon = teleponInput.value.trim();
        const password = passwordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();
        
        if (nama === '' || email === '' || telepon === '' || password === '' || confirmPassword === '') {
            alert('Mohon isi Keterangannya !');
            return;
        }
        
        window.location.href = 'index.html';
    });
});
    </script>
</body>
</html>
